name: K28 Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  core:
    name: Core code and roster consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-k28.mjs
  archive:
    name: Full archive readiness (requires 20 original/processed photos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-k28.mjs --strict
